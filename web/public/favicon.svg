<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="306" height="306" viewBox="30 30 306 306" role="img" aria-labelledby="title desc">
  <title id="title">MorphMimic mirrored-M mark</title>
  <desc id="desc">A dark upright M reflected by a teal upside-down M.</desc>

  <g transform="translate(34 34)">
    <rect x="7" y="9" width="292" height="292" rx="68" fill="#1E2A33" opacity="0.10"/>
    <rect width="292" height="292" rx="68" fill="#F4F7F8"/>
    <circle cx="146" cy="146" r="112" fill="none" stroke="#D7E0E4" stroke-width="3"/>

    <!-- Two mirrored M shapes: upright above, reflected below -->
    <path d="M76 154 L76 74 L146 136 L216 74 L216 154"
          fill="none" stroke="#1E2A33" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 138 L76 218 L146 156 L216 218 L216 138"
          fill="none" stroke="#2A8C88" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="146" cy="146" r="8" fill="#E2BC5A"/>
  </g>
</svg>
